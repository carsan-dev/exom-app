name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      build_number:
        description: "Optional Android build number override. Must be higher than pubspec base build."
        required: false
        type: string
      update_policy:
        description: "Mobile update prompt policy"
        required: true
        default: "recommended"
        type: choice
        options:
          - none
          - recommended
          - blocking

jobs:
  build:
    name: Build and upload AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: "stable"
          cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/exom-release-key.jks

      - name: Write key.properties
        run: |
          cat > android/app/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=exom-release-key.jks
          EOF

      - name: Write google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Set Android build version
        env:
          BUILD_NUMBER_INPUT: ${{ github.event.inputs.build_number }}
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BUILD_NAME="${VERSION_LINE%%+*}"
          BASE_BUILD_NUMBER="${VERSION_LINE##*+}"

          if [ "$BASE_BUILD_NUMBER" = "$VERSION_LINE" ]; then
            BASE_BUILD_NUMBER=0
          fi

          if [ -n "$BUILD_NUMBER_INPUT" ]; then
            BUILD_NUMBER="$BUILD_NUMBER_INPUT"
          else
            BUILD_NUMBER=$((BASE_BUILD_NUMBER + GITHUB_RUN_NUMBER))
          fi

          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid build number: $BUILD_NUMBER"
            exit 1
          fi

          if [ "$BUILD_NUMBER" -le "$BASE_BUILD_NUMBER" ]; then
            echo "Build number $BUILD_NUMBER must be higher than base pubspec build $BASE_BUILD_NUMBER"
            exit 1
          fi

          echo "ANDROID_BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "ANDROID_BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Using Android build $BUILD_NAME ($BUILD_NUMBER)"

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate icons
        run: dart run flutter_launcher_icons

      - name: Generate splash
        run: dart run flutter_native_splash:create

      - name: Build AAB
        run: flutter build appbundle --release --build-name "$ANDROID_BUILD_NAME" --build-number "$ANDROID_BUILD_NUMBER"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Play Store
        if: ${{ github.event_name == 'push' || github.event.inputs.track != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.exommethod.exom
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Update mobile config
        env:
          MOBILE_CONFIG_API_URL: ${{ secrets.MOBILE_CONFIG_API_URL }}
          MOBILE_CONFIG_UPDATE_TOKEN: ${{ secrets.MOBILE_CONFIG_UPDATE_TOKEN }}
          UPDATE_POLICY: ${{ github.event.inputs.update_policy || 'recommended' }}
        run: |
          : "${MOBILE_CONFIG_API_URL:?MOBILE_CONFIG_API_URL secret is required}"
          : "${MOBILE_CONFIG_UPDATE_TOKEN:?MOBILE_CONFIG_UPDATE_TOKEN secret is required}"

          curl --fail --show-error --silent \
            --request PATCH \
            --url "${MOBILE_CONFIG_API_URL%/}/public/mobile-config/release" \
            --header "Content-Type: application/json" \
            --header "x-mobile-config-token: $MOBILE_CONFIG_UPDATE_TOKEN" \
            --data "{
              \"platform\": \"android\",
              \"version\": \"$ANDROID_BUILD_NAME\",
              \"build\": $ANDROID_BUILD_NUMBER,
              \"policy\": \"$UPDATE_POLICY\"
            }"
