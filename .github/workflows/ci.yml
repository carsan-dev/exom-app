name: App CI

on:
  push:
    branches: [main, 'feat/**', 'feature/**', 'fix/**', 'phase9/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: node --test scripts/verify-release.test.mjs
