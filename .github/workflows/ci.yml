name: App CI

on:
  push:
    branches: [main, 'feat/**', 'feature/**', 'fix/**', 'phase9/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      # Goldens are generated on Windows (L5-D50); the golden job below runs them.
      - run: flutter test --exclude-tags golden
      - run: node --test scripts/verify-release.test.mjs

  golden:
    name: Golden tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --tags golden
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: test/golden/failures/
          if-no-files-found: ignore
          retention-days: 14
