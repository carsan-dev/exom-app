name: Publish Mobile Release Metadata

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: "Successful Mobile Release run ID for this exact commit"
        required: true
        type: string
      update_policy:
        description: "Mobile update prompt policy"
        required: true
        default: "recommended"
        type: choice
        options:
          - none
          - recommended
          - blocking

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release metadata
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify successful release and its immutable manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: node scripts/verify-release.mjs

      - name: Update Android mobile config
        env:
          MOBILE_CONFIG_API_URL: ${{ secrets.MOBILE_CONFIG_API_URL }}
          MOBILE_CONFIG_UPDATE_TOKEN: ${{ secrets.MOBILE_CONFIG_UPDATE_TOKEN }}
          UPDATE_POLICY: ${{ inputs.update_policy }}
        run: |
          curl --fail --show-error --silent \
            --request PATCH \
            --url "${MOBILE_CONFIG_API_URL%/}/public/mobile-config/release" \
            --header "Content-Type: application/json" \
            --header "x-mobile-config-token: $MOBILE_CONFIG_UPDATE_TOKEN" \
            --data "{
              \"platform\": \"android\",
              \"version\": \"$BUILD_NAME\",
              \"build\": $BUILD_NUMBER,
              \"policy\": \"$UPDATE_POLICY\"
            }"
      - name: Update iOS mobile config
        env:
          MOBILE_CONFIG_API_URL: ${{ secrets.MOBILE_CONFIG_API_URL }}
          MOBILE_CONFIG_UPDATE_TOKEN: ${{ secrets.MOBILE_CONFIG_UPDATE_TOKEN }}
          UPDATE_POLICY: ${{ inputs.update_policy }}
        run: |
          curl --fail --show-error --silent \
            --request PATCH \
            --url "${MOBILE_CONFIG_API_URL%/}/public/mobile-config/release" \
            --header "Content-Type: application/json" \
            --header "x-mobile-config-token: $MOBILE_CONFIG_UPDATE_TOKEN" \
            --data "{
              \"platform\": \"ios\",
              \"version\": \"$BUILD_NAME\",
              \"build\": $BUILD_NUMBER,
              \"policy\": \"$UPDATE_POLICY\"
            }"
